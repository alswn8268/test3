<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>숏폼 렌더러</title>
<!-- 큰 숫자용 Noto Serif KR (npm run setup 이 vendor/ 로 복사) -->
<link rel="stylesheet" href="vendor/noto-serif-kr/900.css">
<style>
  @font-face { font-family: "Pre"; src: url(../assets/fonts/Pretendard-Black.otf); font-weight: 900; }
  @font-face { font-family: "Pre"; src: url(../assets/fonts/Pretendard-ExtraBold.otf); font-weight: 800; }
  @font-face { font-family: "Pre"; src: url(../assets/fonts/Pretendard-Bold.otf); font-weight: 700; }
  @font-face { font-family: "Pre"; src: url(../assets/fonts/Pretendard-SemiBold.otf); font-weight: 600; }
  @font-face { font-family: "Pre"; src: url(../assets/fonts/Pretendard-Medium.otf); font-weight: 500; }

  /* 3색 팔레트: 종이 · 먹 · 신호 주황 */
  :root { --paper:#EFE9DD; --ink:#16130F; --signal:#FF4B1F; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width:1080px; height:1920px; overflow:hidden; }
  body { font-family: "Pre", sans-serif; background: var(--paper); color: var(--ink);
         font-feature-settings: "tnum" 1; -webkit-font-smoothing: antialiased; }
  body.dark { background: var(--ink); color: var(--paper); }

  #deco { position:absolute; inset:0; z-index:0; pointer-events:none; transform-origin:50% 45%; }
  #gl { position:absolute; inset:0; z-index:1; }
  /* 그레인은 일반 합성으로 (블렌드 모드는 프레임마다 비쌈): 종이 위엔 어두운 점, 먹 위엔 밝은 점 */
  #grain { position:absolute; inset:0; z-index:3; pointer-events:none; opacity:.10; }
  #grain.light { opacity:.06; }

  /* 상단 헤더 (릴스 상단 UI 아래로) */
  #head { position:absolute; left:90px; right:150px; top:210px; z-index:2;
          display:flex; justify-content:space-between; align-items:center;
          font-weight:800; font-size:32px; letter-spacing:-0.5px; }
  #head .mark { display:flex; align-items:center; gap:14px; }
  #head .mark i { width:22px; height:22px; background:var(--signal); display:inline-block; }
  /* 장면 번호(01/12)는 '넘기는 슬라이드' 느낌을 줘서 숨긴다 (진행 바만 남김) */
  #head .count { display:none; }
  #rule { position:absolute; left:90px; right:150px; top:272px; height:0; z-index:2;
          border-top:3px dashed currentColor; opacity:.35; }
  #series { position:absolute; left:90px; top:300px; z-index:2; font-weight:700; font-size:28px;
            padding:8px 16px; border:3px solid currentColor; border-radius:999px; opacity:.75; }

  /* 협찬·광고 표시: 영상 처음부터 끝까지 보이게 (공정위 심사지침 — 쉽게 알아볼 수 있는 위치·크기) */
  #adtag { position:absolute; right:150px; top:300px; z-index:4; display:none; font-weight:800; font-size:30px;
           padding:8px 18px; border-radius:10px; background:var(--ink); color:var(--paper); border:3px solid var(--paper); }
  body.dark #adtag { background:var(--paper); color:var(--ink); border-color:var(--ink); }

  /* 본문 */
  #stage { position:absolute; left:90px; right:150px; top:470px; z-index:2; transform-origin: 0 0; }
  .label { font-weight:800; font-size:38px; color:var(--signal-text); letter-spacing:1px; margin-bottom:34px; }
  .line { font-weight:900; font-size:116px; line-height:1.17; letter-spacing:-4px; white-space:nowrap; }
  .hook .line { font-size:126px; }
  .sub { font-weight:600; font-size:48px; line-height:1.35; margin-top:44px; opacity:.72; letter-spacing:-1px; }
  .hl { position:relative; display:inline-block; z-index:0; }
  .hl::before { content:""; position:absolute; left:-10px; right:-10px; bottom:6%; height:46%;
                background:var(--signal); z-index:-1; transform-origin:0 50%; transform:scaleX(var(--w,0)); }
  .red { color:var(--signal-text); }
  /* 신호색이 밝은 채널(노랑 등)은 종이 위 글자용 색을 따로 쓴다. 먹 배경에선 원래 신호색 */
  body.dark { --signal-text: var(--signal); }

  .pre { font-weight:600; font-size:52px; opacity:.75; letter-spacing:-1px; }
  .big { font-family:"Noto Serif CJK KR", "Noto Serif KR", serif; font-weight:900; font-size:250px; line-height:1.05;
         letter-spacing:-10px; color:var(--signal); margin:24px 0 18px -6px; white-space:nowrap; }
  .num .sub { font-weight:700; opacity:.9; font-size:56px; margin-top:10px; }

  .cmp { display:flex; gap:28px; margin-top:20px; }
  .cmp .box { flex:1 1 0; min-width:0; overflow:hidden; border:5px solid var(--ink); padding:36px 30px 30px; background:var(--paper); }
  .cmp .v { white-space:nowrap; letter-spacing:-0.035em; }
  .cmp .box.on { background:var(--ink); color:var(--paper); }
  .cmp .k { font-weight:800; font-size:44px; }
  .cmp .v { font-family:"Noto Serif CJK KR", "Noto Serif KR", serif; font-weight:900; font-size:170px; letter-spacing:-6px; line-height:1.1; }
  .cmp .on .v { color:var(--signal); }
  .cmp-title { font-weight:900; font-size:96px; letter-spacing:-3px; line-height:1.15; }
  .cmp .v.word { font-family:"Pre", sans-serif; letter-spacing:-4px; }

  /* 단축키 장면: 키캡 */
  .keys { display:flex; align-items:center; gap:22px; margin:40px 0 10px; white-space:nowrap; }
  .kc { font-weight:900; font-size:76px; letter-spacing:-2px; line-height:1; padding:26px 34px 22px; border:6px solid currentColor;
        border-bottom-width:18px; border-radius:22px; background:var(--paper); transform-origin:50% 100%; }
  .kc.last { background:var(--signal); }
  .plus { font-weight:800; font-size:64px; opacity:.6; }

  .items { margin-top:10px; }
  .item { display:flex; align-items:center; gap:30px; font-weight:800; font-size:62px; letter-spacing:-2px;
          padding:30px 0; border-bottom:3px dashed rgba(22,19,15,.3); }
  .box64 { width:74px; height:74px; border:6px solid currentColor; flex:none; position:relative; }
  .box64 svg { position:absolute; left:-6px; top:-14px; width:96px; height:96px; overflow:visible; }

  .stamp { position:absolute; right:-20px; top:560px; width:330px; height:330px; border-radius:50%;
           border:12px solid var(--signal-text); color:var(--signal-text); display:flex; align-items:center; justify-content:center;
           font-weight:900; font-size:96px; letter-spacing:-2px; }
  .stamp::after { content:""; position:absolute; inset:16px; border-radius:50%; border:4px solid var(--signal-text); }

  /* 하단 진행 바 (릴스 하단 UI 위) */
  #bar { position:absolute; left:90px; right:150px; top:1500px; height:8px; z-index:2; background:currentColor; opacity:.15; }
  #barfill { position:absolute; left:90px; top:1500px; height:8px; z-index:2; background:var(--signal); }

  /* ================================================================
     채널 테마 — 색만이 아니라 배경·글꼴·강조·등장 모션·3D 배치가 다르다
     ledger(월급) 종이 장부 · sheet(단축키) 엑셀 화면 · notebook(맞춤법) 공책과 칠판 · lab(호기심) 파란 실험실
     ================================================================ */

  /* ---- sheet: 엑셀 화면. 셀 격자 + 행/열 번호, 강조 = 셀 선택 상자, 글자는 타이핑 ---- */
  .theme-sheet #rule { display:none; }
  .theme-sheet #series { border-radius:6px; border-width:3px; }
  .theme-sheet .label { display:inline-block; padding:6px 16px; border:4px solid var(--signal-text); margin-bottom:28px; }
  .theme-sheet .hl::before { left:-14px; right:-14px; bottom:-2%; height:104%;
      background:color-mix(in srgb, var(--signal) 20%, transparent); outline:6px solid var(--signal); }
  .theme-sheet .hl::after { content:""; position:absolute; right:-22px; bottom:-10px; width:18px; height:18px;
      background:var(--signal); border:3px solid var(--paper); opacity:clamp(0, calc((var(--w, 0) - 0.95) * 20), 1); }
  .theme-sheet .pre::before { content:"fx"; font-style:italic; font-weight:800; margin-right:18px; opacity:.6; }
  .theme-sheet .pre { display:inline-block; padding:8px 18px; border:3px solid currentColor; border-radius:6px; }
  .theme-sheet .cmp .box { border-width:4px; border-radius:6px; }
  .theme-sheet .cmp .box.on { outline:8px solid var(--signal); outline-offset:-4px; }
  .theme-sheet .item { border-bottom:3px solid rgba(127,127,127,.25); }

  /* ---- notebook: 공책(밝은 장면)과 칠판(어두운 장면). 제목은 명조, 강조 = 형광 밑줄, 글자는 써 내려가듯 ---- */
  .theme-notebook #rule { border-top-style:solid; opacity:.25; }
  .theme-notebook .line, .theme-notebook .cmp-title { font-family:"Noto Serif CJK KR", "Noto Serif KR", serif; letter-spacing:-4px; line-height:1.22; }
  .theme-notebook .line { font-size:104px; }
  .theme-notebook .hook .line { font-size:110px; }
  .theme-notebook .cmp-title { font-size:88px; }
  .theme-notebook .hl::before { left:-6px; right:-6px; bottom:-4%; height:20%; border-radius:10px; transform:scaleX(var(--w,0)) rotate(-1.4deg); }
  .theme-notebook .label { font-style:normal; letter-spacing:2px; }
  .theme-notebook .label::before { content:"✎ "; }
  .theme-notebook .cmp .box { border:3px solid currentColor; border-radius:16px; }
  .theme-notebook .cmp .box:first-child { transform:rotate(-1.5deg); }
  .theme-notebook .cmp .box.on { transform:rotate(1.2deg); }
  .theme-notebook .cmp .vw { position:relative; display:inline-block; }
  .theme-notebook .strike { position:absolute; left:-6%; top:52%; height:12px; width:112%; background:var(--signal-text);
      border-radius:6px; transform-origin:0 50%; transform:scaleX(0) rotate(-4deg); }
  .theme-notebook .ring { position:absolute; left:-14%; top:-22%; width:128%; height:144%; overflow:visible; }
  .theme-notebook .item { border-bottom:3px solid color-mix(in srgb, var(--signal) 35%, transparent); }

  /* ---- lab: 파란 실험실. 흰 글자 + 굵은 남색 외곽선, 강조 = 노란 글자 팡, 가운데 정렬, 3D 크게 위쪽 ---- */
  .theme-lab { color:#fff; }
  .theme-lab #rule { border-top-style:solid; opacity:.3; }
  .theme-lab #head .mark i { border-radius:50%; }
  .theme-lab #stage { top:960px; text-align:center; transform-origin:50% 0; }
  .theme-lab .line, .theme-lab .cmp-title, .theme-lab .big, .theme-lab .pre, .theme-lab .sub, .theme-lab .item {
      color:#fff; -webkit-text-stroke:16px var(--ink); paint-order:stroke fill; }
  .theme-lab .line { font-size:108px; line-height:1.2; }
  .theme-lab .hook .line { font-size:116px; }
  .theme-lab .sub { -webkit-text-stroke:10px var(--ink); opacity:1; font-weight:800; }
  .theme-lab .pre { -webkit-text-stroke:10px var(--ink); opacity:1; font-weight:800; }
  .theme-lab .hl { color:var(--signal); transform:scale(calc(1.3 - 0.3 * var(--w, 0))); transform-origin:50% 60%; }
  .theme-lab .hl::before { display:none; }
  .theme-lab .red { color:var(--signal); }
  .theme-lab .label { display:inline-block; background:var(--signal); color:var(--ink); padding:10px 26px; border-radius:999px;
      border:5px solid var(--ink); margin-bottom:26px; }
  .theme-lab .big { color:var(--signal); font-family:"Pre", sans-serif; letter-spacing:-6px; margin:10px 0; }
  .theme-lab .cmp .box { background:#fff; color:var(--ink); border:6px solid var(--ink); border-radius:28px; text-align:center; }
  .theme-lab .cmp .box.on { background:var(--signal); color:var(--ink); }
  .theme-lab .cmp .on .v { color:var(--ink); }
  .theme-lab .items { display:table; margin:0 auto; text-align:left; }
  .theme-lab .item { border-bottom:none; -webkit-text-stroke:12px var(--ink); }
  .theme-lab .box64 { background:#fff; color:var(--ink); border-color:var(--ink); border-radius:12px; }
  .theme-lab .stamp { top:-430px; right:20px; background:#fff; border-color:var(--ink); color:var(--ink); }
  .theme-lab .stamp::after { border-color:var(--ink); }
  .theme-lab #bar { background:#fff; opacity:.3; }
</style>
</head>
<body>
<canvas id="deco" width="1080" height="1920"></canvas>
<canvas id="gl" width="1080" height="1920"></canvas>
<div id="head"><div class="mark"><i></i><span id="wordmark"></span></div><div class="count" id="count">01 / 12</div></div>
<div id="rule"></div>
<div id="series"></div>
<div id="adtag"></div>
<div id="stage"></div>
<div id="bar"></div><div id="barfill"></div>
<canvas id="grain" width="1080" height="1920"></canvas>

<script type="module">
import * as THREE from './vendor/three.module.js';

// 채널 설정 + 대본 한 편을 읽는다.  ?ch=money&ep=ep01
const params = new URLSearchParams(location.search);
const chName = params.get('ch') || 'money';
const channel = await (await fetch(`../channels/${chName}/channel.json`)).json();
const ep = await (await fetch(`../channels/${chName}/episodes/${params.get('ep') || 'ep01'}/script.json`)).json();
// 채널마다 색 3개만 바꾼다 (종이 · 먹 · 신호색)
const hex = v => parseInt(v.slice(1), 16);
const C = { paper: hex(channel.colors.paper), ink: hex(channel.colors.ink), signal: hex(channel.colors.signal) };
for (const k of ['paper', 'ink', 'signal']) document.documentElement.style.setProperty(`--${k}`, channel.colors[k]);
document.documentElement.style.setProperty('--signal-text', channel.colors.signal_text || channel.colors.signal);
document.getElementById('wordmark').textContent = channel.name;
const THEME = channel.theme || 'ledger';
document.body.classList.add(`theme-${THEME}`);
const PROPS = { hero: 'card', stack: 'coin', point: ['card', 'coin', 'receipt'], ...(channel.props || {}) };
const scenes = ep.scenes.map(s => ({ dur: 2.4, ...s }));
let acc = 0; for (const s of scenes) { s.t0 = acc; acc += s.dur; }
const TOTAL = acc;
document.getElementById('series').textContent = ep.series;
// tools/common.py 의 SPONSOR_KINDS 와 같은 문구
const AD = { paid: '유료 광고 포함', gifted: '협찬 · 제품 제공', affiliate: '제휴 링크 · 수수료 받음' };
if (ep.sponsor && AD[ep.sponsor.kind]) { const t = document.getElementById('adtag'); t.textContent = AD[ep.sponsor.kind]; t.style.display = 'block'; }

// ---------- 종이 질감(그레인): 한 번만 그려 둔다 (SVG 필터는 매 프레임 다시 계산돼 느림) ----------
{
  const g = document.getElementById('grain').getContext('2d');
  const img = g.createImageData(1080, 1920); let seed = 7;
  const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < img.data.length; i += 4) { const a = rand(); img.data[i + 3] = a > 0.35 ? (a - 0.35) * 255 : 0; }
  g.putImageData(img, 0, 0);
}
const setGrain = dark => { const c = document.getElementById('grain'); if (c.classList.contains('light') === dark) return;
  const g = c.getContext('2d'); const d = g.getImageData(0, 0, 1080, 1920); const v = dark ? 255 : 0;
  for (let i = 0; i < d.data.length; i += 4) { d.data[i] = d.data[i + 1] = d.data[i + 2] = v; }
  g.putImageData(d, 0, 0); c.classList.toggle('light', dark); };

// ---------- 테마 배경 (#deco): 밝은/어두운 장면이 바뀔 때만 다시 그린다 ----------
let decoDark = null;
function drawDeco(dark) {
  if (decoDark === dark) return; decoDark = dark;
  const c = document.getElementById('deco'), g = c.getContext('2d'), W = 1080, H = 1920;
  g.clearRect(0, 0, W, H);
  const col = channel.colors, fg = dark ? col.paper : col.ink;
  const line = (x1, y1, x2, y2) => { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); };
  if (THEME === 'sheet') {           // 엑셀: 셀 격자 + 열 머리(A B C…) + 행 번호
    g.fillStyle = dark ? col.ink : col.paper; g.fillRect(0, 0, W, H);
    const top = 400, cw = 190, rh = 72, gut = 70;
    g.globalAlpha = dark ? 0.10 : 0.09; g.strokeStyle = fg; g.lineWidth = 2;
    for (let x = gut; x <= W; x += cw) line(x, top, x, H);
    for (let y = top; y <= H; y += rh) line(0, y, W, y);
    g.globalAlpha = dark ? 0.08 : 0.06; g.fillStyle = fg; g.fillRect(0, top, W, rh); g.fillRect(0, top, gut, H);
    g.globalAlpha = dark ? 0.35 : 0.4; g.font = '700 30px Pre'; g.textAlign = 'center'; g.textBaseline = 'middle';
    'ABCDEF'.split('').forEach((ch, i) => g.fillText(ch, gut + cw * i + cw / 2, top + rh / 2));
    for (let n = 1, y = top + rh; y < H; n++, y += rh) g.fillText(String(n), gut / 2, y + rh / 2);
  } else if (THEME === 'notebook') {
    g.fillStyle = dark ? (col.board || col.ink) : col.paper; g.fillRect(0, 0, W, H);
    if (dark) {                       // 칠판: 분필 자국
      let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      for (let i = 0; i < 26; i++) { const x = rnd() * W, y = rnd() * H, rr = 80 + rnd() * 260;
        const grd = g.createRadialGradient(x, y, 0, x, y, rr); grd.addColorStop(0, 'rgba(255,255,255,0.05)'); grd.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = grd; g.fillRect(x - rr, y - rr, rr * 2, rr * 2); }
      g.globalAlpha = 0.5; g.fillStyle = '#8a6a43'; g.fillRect(0, H - 40, W, 40);   // 분필 받침
    } else {                          // 공책: 가로줄 + 빨간 여백선 + 구멍
      g.strokeStyle = col.signal; g.globalAlpha = 0.22; g.lineWidth = 3;
      for (let y = 452; y < H; y += 92) line(0, y, W, y);
      g.strokeStyle = '#E0443A'; g.globalAlpha = 0.45; line(66, 0, 66, H); line(74, 0, 74, H);
      g.globalAlpha = 0.12; g.fillStyle = col.ink; for (const y of [560, 960, 1360]) { g.beginPath(); g.arc(30, y, 16, 0, Math.PI * 2); g.fill(); }
    }
  } else if (THEME === 'lab') {      // 파란 실험실: 위가 밝은 그라데이션 (바닥 격자는 3D)
    const grd = g.createLinearGradient(0, 0, 0, H);
    if (dark) { grd.addColorStop(0, '#1C2E66'); grd.addColorStop(1, col.ink); }
    else { grd.addColorStop(0, '#8DB6FF'); grd.addColorStop(0.55, col.paper); grd.addColorStop(1, '#3A6CDB'); }
    g.fillStyle = grd; g.fillRect(0, 0, W, H);
  }
  g.globalAlpha = 1;
}

// ---------- 유틸 ----------
const clamp = (x, a=0, b=1) => Math.min(b, Math.max(a, x));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 4);
const easeBack = x => { x = clamp(x); const c1 = 1.7, c3 = c1 + 1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const mark = s => esc(s).replace(/\[(.+?)\]/g, '<span class="hl">$1</span>').replace(/\{(.+?)\}/g, '<span class="red">$1</span>');
const isDark = s => ['hook','number'].includes(s.type);

// ---------- 3D 세팅 ----------
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true, preserveDrawingBuffer:true });
renderer.setPixelRatio(1); renderer.setSize(1080, 1920, false);
const scene3 = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1080/1920, 0.1, 100);
camera.position.set(0, 0, 20);
const UNIT = 1920 / (2 * 20 * Math.tan(THREE.MathUtils.degToRad(17.5)));   // px per world unit at z=0
const px2w = (x, y) => [(x - 540) / UNIT, (960 - y) / UNIT];

const tones = new Uint8Array([90, 170, 255]);
const grad = new THREE.DataTexture(tones, 3, 1, THREE.RedFormat); grad.needsUpdate = true;
grad.minFilter = grad.magFilter = THREE.NearestFilter;
const toon = c => new THREE.MeshToonMaterial({ color: c, gradientMap: grad });
const outlineMat = new THREE.MeshBasicMaterial({ color: C.ink, side: THREE.BackSide });

scene3.add(new THREE.AmbientLight(0xffffff, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(-6, 9, 10); scene3.add(sun);

function withOutline(geo, mat, thick = 0.06) {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(geo, mat));
  const o = new THREE.Mesh(geo, outlineMat);
  geo.computeBoundingBox(); const bb = geo.boundingBox; const size = new THREE.Vector3(); bb.getSize(size);
  o.scale.set(1 + thick*2/size.x, 1 + thick*2/size.y, 1 + thick*2/Math.max(size.z, .2));
  g.add(o); return g;
}
function coin(face = C.signal) {
  const g = new THREE.Group();
  const body = withOutline(new THREE.CylinderGeometry(1, 1, 0.26, 48), toon(face));

  const st = stage.querySelector('.stamp');
  if (st) { const d = clamp((lt - 0.7) / 0.18); st.style.opacity = d > 0 ? 1 : 0;
    st.style.transform = `rotate(-14deg) scale(${1 + (1 - d) * 1.6})`; }
  // 카메라 리듬: 멈춤 → 빠르게 다가감 → 멈춤 (느린 일정 확대 대신). huashu-art-motion '맥박 리듬' 참고
  const P = pulse(lt);
  stage.style.transform = `scale(${P.txt})`;
  document.getElementById('deco').style.transform = `scale(${P.bg})`;
  CAM_Z = 20 - 3.4 * (P.bg - 1) / 0.08;
  if (labGrid) labGrid.position.z = (lt * 1.6) % 2;    // 실험실 바닥 격자가 천천히 다가옴
}

window.TOTAL = TOTAL;
window.SCENES = scenes.map(s => ({ t0: s.t0, dur: s.dur, type: s.type }));
window.seek = (t) => {
  let i = scenes.findIndex(s => t >= s.t0 && t < s.t0 + s.dur); if (i < 0) i = scenes.length - 1;
  const s = scenes[i], lt = t - s.t0;
  if (i !== sceneIdx) { sceneIdx = i; buildDOM(s); build3D(s, i);
    document.getElementById('count').textContent = `${String(i+1).padStart(2,'0')} / ${scenes.length}`; }
  updateDOM(s, lt); update3D(lt, s.dur);
  document.getElementById('barfill').style.width = `${(840) * (t / TOTAL)}px`;
};
await document.fonts.ready;
await document.fonts.load('900 100px "Noto Serif CJK KR"');
await document.fonts.load('900 100px "Noto Serif KR"', '0123456789,.%+만원');
window.seek(0);
window.ready = true;
</script>
</body>
